name: Build desktop app

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A newer push to a branch makes the older build irrelevant, but a tag build
# is a release in progress: never cancel one halfway through publishing.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            platform: windows-x64
          - os: ubuntu-latest
            name: Linux
            platform: linux-x64

    steps:
      - uses: actions/checkout@v7

      # A release is named after its tag, and the app shows its version (the
      # one in package.json) in its top bar. Fail before spending a build on a
      # tag the two disagree on.
      - name: Check the tag matches the app's version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          if [ "v$APP_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error file=package.json::Tag $GITHUB_REF_NAME does not match version \"$APP_VERSION\" in package.json."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # electron-builder writes the installers and, on the way, the app as a
      # folder, dist/<platform>-unpacked; that is renamed HexapodLink/, the
      # folder the portable archives unpack to.
      - name: Build
        shell: bash
        run: |
          npm run dist
          mv dist/*-unpacked dist/HexapodLink

      # The built app, driven as a person would against the stand-in robot:
      # what proves the bundle is complete is that it runs. Linux has no
      # display on the runner, so it gets a virtual one.
      - name: Smoke test the bundle
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            export HEXAPOD_LINK_EXECUTABLE="$PWD/dist/HexapodLink/HexapodLink.exe"
            npm run smoke
          else
            export HEXAPOD_LINK_EXECUTABLE="$PWD/dist/HexapodLink/HexapodLink"
            xvfb-run -a -s "-screen 0 1600x1000x24" npm run smoke
          fi

      - name: Report bundle size
        shell: bash
        run: du -sh dist/HexapodLink

      # What people download, for every build so any push can be tried out:
      #   - the installer electron-builder wrote: a setup .exe on Windows, an
      #     AppImage and a .deb on Linux
      #   - a portable archive of the same app that unpacks to one HexapodLink/
      #     folder. Linux gets a tarball because zip drops the executable bit,
      #     and a binary that needs a chmod before it runs is a support question.
      # On a tag the version equals the tag (checked above), so names match the
      # release either way.
      - name: Package
        shell: bash
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          NAME="HexapodLink-v${APP_VERSION}-${{ matrix.platform }}"
          mkdir -p release
          if [ "$RUNNER_OS" == "Windows" ]; then
            mv dist/HexapodLink-*-setup.exe release/
            (cd dist && 7z a -tzip -mx=9 "../release/$NAME-portable.zip" HexapodLink > /dev/null)
          else
            mv dist/HexapodLink-*.AppImage dist/HexapodLink-*.deb release/
            tar -czf "release/$NAME-portable.tar.gz" -C dist HexapodLink
          fi
          ls -lh release

      - uses: actions/upload-artifact@v7
        with:
          name: HexapodLink-${{ matrix.platform }}
          path: release/*
          # Off a plain push these are only for trying a build, and the default
          # 90 days is far longer than they stay interesting. A tag keeps them
          # long enough for the release job, and a re-run of it.
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 7 || 1 }}
          if-no-files-found: error

  # Runs only for a v* tag, and only once every platform built and passed its
  # smoke test: a release missing one platform is worse than a late one.
  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: HexapodLink-*
          path: release
          merge-multiple: true

      - name: Write checksums
        working-directory: release
        run: |
          sha256sum HexapodLink-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # A tag like v1.1.0-rc.1 publishes as a pre-release, so it is offered to
      # nobody who just clicks "Latest". Re-running the workflow on a tag that
      # already has a release replaces its files rather than failing.
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            FLAGS=(--title "Hexapod Link ${TAG#v}" --generate-notes --verify-tag)
            case "$TAG" in *-*) FLAGS+=(--prerelease) ;; esac
            gh release create "$TAG" release/* "${FLAGS[@]}"
          fi
