name: Build desktop app

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A newer push to a branch makes the older build irrelevant, but a tag build
# is a release in progress: never cancel one halfway through publishing.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            artifact: HexapodLink-windows
            platform: windows-x64
          - os: ubuntu-latest
            name: Linux
            artifact: HexapodLink-linux
            platform: linux-x64

    steps:
      - uses: actions/checkout@v7

      # A release is named after its tag, and the app shows its version (the
      # one in package.json) in its top bar. Fail before spending a build on a
      # tag the two disagree on.
      - name: Check the tag matches the app's version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          if [ "v$APP_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error file=package.json::Tag $GITHUB_REF_NAME does not match version \"$APP_VERSION\" in package.json."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # electron-builder writes the app as a folder, dist/<platform>-unpacked;
      # it is renamed HexapodLink/, the folder the release archives unpack to.
      - name: Build
        shell: bash
        run: |
          npm run dist
          mv dist/*-unpacked dist/HexapodLink

      # The built app, driven as a person would against the stand-in robot:
      # what proves the bundle is complete is that it runs. Linux has no
      # display on the runner, so it gets a virtual one.
      - name: Smoke test the bundle
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            export HEXAPOD_LINK_EXECUTABLE="$PWD/dist/HexapodLink/HexapodLink.exe"
            npm run smoke
          else
            export HEXAPOD_LINK_EXECUTABLE="$PWD/dist/HexapodLink/HexapodLink"
            xvfb-run -a -s "-screen 0 1600x1000x24" npm run smoke
          fi

      - name: Report bundle size
        shell: bash
        run: du -sh dist/HexapodLink

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/HexapodLink
          # These are build outputs off every push; the default 90 days is far
          # longer than they stay interesting.
          retention-days: 1
          if-no-files-found: error

      # The archives that go on the release. Each unpacks to one HexapodLink/
      # folder. Linux gets a tarball because zip drops the executable bit, and
      # a binary that needs a chmod before it runs is a support question.
      - name: Package for release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          mkdir -p release
          NAME="HexapodLink-${GITHUB_REF_NAME}-${{ matrix.platform }}"
          cd dist
          if [ "$RUNNER_OS" == "Windows" ]; then
            7z a -tzip -mx=9 "../release/$NAME.zip" HexapodLink > /dev/null
          else
            tar -czf "../release/$NAME.tar.gz" HexapodLink
          fi
          ls -lh ../release

      - name: Upload release archive
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: release/*
          retention-days: 7
          if-no-files-found: error

  # Runs only for a v* tag, and only once every platform built and passed its
  # smoke test: a release missing one platform is worse than a late one.
  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Write checksums
        working-directory: release
        run: |
          sha256sum HexapodLink-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # A tag like v1.1.0-rc.1 publishes as a pre-release, so it is offered to
      # nobody who just clicks "Latest". Re-running the workflow on a tag that
      # already has a release replaces its files rather than failing.
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            FLAGS=(--title "Hexapod Link ${TAG#v}" --generate-notes --verify-tag)
            case "$TAG" in *-*) FLAGS+=(--prerelease) ;; esac
            gh release create "$TAG" release/* "${FLAGS[@]}"
          fi
