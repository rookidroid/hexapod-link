name: Lint

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  biome:
    name: Biome lint and format check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Biome is pinned in package.json, so the formatter gives the same output
      # here as on a contributor's machine.
      - name: Install dependencies
        run: npm ci

      # The GitHub reporter turns each finding into an annotation on the diff.
      - name: Lint and check formatting
        run: npx biome ci --reporter=github .
