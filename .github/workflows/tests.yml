name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run's result irrelevant.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      # One platform failing is worth knowing about even if the other is fine.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Type errors anywhere -- the page, the main process, the tools -- fail
      # here, including in code no test reaches.
      - name: Typecheck
        run: npm run typecheck

      # The kinematics against what the Python version computed, the robot
      # link against the stand-in robot over real UDP and HTTP, and what is
      # kept on disk. Nothing here needs a display or a robot.
      - name: Run tests
        run: npm test

  app:
    name: Drive the app
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The app, driven as a person would against the stand-in robot: connect,
      # pose, add a gait, play, run it on the robot, drive, close, reopen.
      - name: Smoke test
        run: xvfb-run -a -s "-screen 0 1600x1000x24" npm run smoke
