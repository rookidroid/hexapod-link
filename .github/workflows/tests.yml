name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run's result irrelevant.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      # One platform failing is worth knowing about even if the other is fine --
      # this suite exists partly because a merge broke it silently.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Nothing here needs a display or a robot: the tests drive the model and
      # the pure conversion layer, not the Dash server or the UDP socket.
      - name: Run tests
        run: pytest

  syntax:
    name: Byte-compile every module
    runs-on: ubuntu-latest

    # The tests import most of the package but not all of it -- the Dash pages
    # and widgets are only reachable through the app. A merge once left an
    # unterminated docstring in a file nothing imported, so compile the lot.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile all sources
        run: python -m compileall -q hexapod pages widgets tests tools *.py

      # Importing index.py builds app.layout and registers every page callback,
      # so this catches a broken widget or a duplicate Dash element id that
      # compiling alone would not.
      - name: Import the full app
        run: python -c "import index; assert index.app.layout is not None"
