[project]
name = "hexapod-robot-simulator"
version = "2.0.0"
description = "A hexapod robot simulator built with Plotly Dash"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["hexapod", "robot", "simulator", "dash", "plotly", "kinematics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "dash>=2.14.0",
    "dash-daq>=0.5.0",
    "plotly>=5.18.0",
    "numpy>=1.24.0",
    "Flask>=2.3.0",
    "Flask-Compress>=1.14",
    "gunicorn>=21.0.0",
]

[project.optional-dependencies]
dev = [
    "flake8>=6.1.0",
    "pylint>=3.0.0",
    "isort>=5.12.0",
    "black>=23.0.0",
    "pytest>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/mithi/hexapod-robot-simulator"
Repository = "https://github.com/mithi/hexapod-robot-simulator"
Issues = "https://github.com/mithi/hexapod-robot-simulator/issues"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hexapod*", "pages*", "widgets*"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip = [".git", "__pycache__", ".venv", "venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short"
