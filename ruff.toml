# Ruff is the linter and the formatter. CI runs `ruff check .` and
# `ruff format --check .`; run `ruff check --fix .` and `ruff format .` locally
# before pushing.

line-length = 100
target-version = "py313"

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",   # line length is the formatter's job; long strings and URLs stay as is
    "B905",   # zip() without strict= -- the paired sequences are built to match
    "UP031",  # %-formatting is used on purpose in the clientside JS strings, whose braces
              # would need doubling with str.format or f-strings
]
