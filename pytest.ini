[pytest]
testpaths = tests

# The repo is run from its root rather than installed, so `import hexapod` needs
# the root on sys.path. Setting it here means `pytest` works on its own, without
# a PYTHONPATH the caller has to remember -- locally and in CI alike.
pythonpath = .

# path_generator still builds its rotation matrices with np.matrix, which numpy
# has been deprecating for years. That is a real thing to fix, but it is not the
# tests' business to report it 200 times per run.
filterwarnings =
    ignore::PendingDeprecationWarning
